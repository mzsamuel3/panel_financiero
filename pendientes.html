<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pendientes</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pendientes">
<link rel="apple-touch-icon" href="icon-pend-180.png">
<link rel="icon" href="icon-pend-192.png">
<link rel="manifest" href="manifest-pendientes.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--bg2:#0e0e0e;--line:#1c1c1c;--line2:#2a2a2a;--hi:#f5f5f5;--mid:#9a9a9a;--dim:#5c5c5c;--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--hi);font:400 16px/1.4 'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--hi)}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(110px + var(--safe-b))}
header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:34px;font-weight:700;letter-spacing:-.03em;margin:0;line-height:1}
.sub{color:var(--dim);font-size:14px;margin-top:8px}
.dots{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mid);font-size:20px;letter-spacing:1px}
.tabs{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 10px;padding:0 20px 2px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 0 11px;color:var(--dim);font-weight:500;font-size:15px;white-space:nowrap;border-bottom:1.5px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--hi);border-color:var(--hi)}
.tab sup{font-size:10px;margin-left:3px;color:var(--dim);font-weight:600}
.tab.on sup{color:var(--mid)}
.row{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);transition:opacity .35s,transform .35s}
.row.go{opacity:0;transform:translateX(18px)}
.ck{flex:0 0 22px;width:22px;height:22px;border-radius:50%;border:1.5px solid #4a4a4a;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:.15s}
.ck svg{opacity:0;width:12px;height:12px}
.row.done .ck{background:var(--hi);border-color:var(--hi)}
.row.done .ck svg{opacity:1}
.tx{flex:1;min-width:0;text-align:left;font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.tx small{display:block;color:var(--dim);font-size:12.5px;margin-top:3px}
.row.imp .tx{font-weight:600}
.row.imp .tx::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--hi);margin:0 8px 3px 0;vertical-align:middle}
.row.done .tx{color:var(--dim);text-decoration:line-through;font-weight:400}
.row.done .tx::before{display:none}
.empty{color:var(--dim);text-align:center;padding:60px 10px;font-size:15px;line-height:1.6}
.hechas-t{display:block;margin:26px 0 4px;color:var(--dim);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.limpiar{display:block;margin:14px auto 0;color:var(--dim);font-size:13px;text-decoration:underline}
/* composer */
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + var(--safe-b));background:linear-gradient(to top,#000 70%,rgba(0,0,0,0));z-index:5}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line2);border-radius:28px;padding:6px 6px 6px 8px}
.dest{flex:0 0 auto;padding:7px 11px;border-radius:20px;background:#1a1a1a;color:var(--mid);font-size:13px;font-weight:600;white-space:nowrap}
.bar input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:16px;padding:8px 2px}
.bar input::placeholder{color:var(--dim)}
.send{flex:0 0 38px;width:38px;height:38px;border-radius:50%;background:var(--hi);color:#000;display:flex;align-items:center;justify-content:center;opacity:.25;transition:opacity .15s}
.send.on{opacity:1}
/* hoja */
.sh-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.sh-bg.show{opacity:1;pointer-events:auto}
.sh{width:100%;max-width:560px;background:#111;border-top:1px solid var(--line2);border-radius:22px 22px 0 0;padding:10px 20px calc(18px + var(--safe-b));transform:translateY(30px);transition:transform .25s cubic-bezier(.2,.8,.25,1)}
.sh-bg.show .sh{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:#333;margin:0 auto 16px}
.sh textarea{width:100%;background:#000;border:1px solid var(--line2);border-radius:14px;padding:13px 14px;font-size:17px;resize:none;outline:none}
.lbl{color:var(--dim);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:20px;border:1px solid var(--line2);color:var(--mid);font-size:14px;font-weight:500}
.chip.on{background:var(--hi);color:#000;border-color:var(--hi)}
.sw{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 0;border-bottom:1px solid var(--line);font-size:16px}
.tog{width:44px;height:26px;border-radius:13px;background:#2a2a2a;position:relative;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#777;transition:.2s}
.tog.on{background:var(--hi)}.tog.on::after{left:21px;background:#000}
.btn{display:block;width:100%;margin-top:18px;padding:15px;border-radius:14px;background:var(--hi);color:#000;font-weight:600;font-size:16px;text-align:center}
.lnk{display:block;width:100%;padding:14px 0 2px;color:var(--mid);font-size:15px;text-align:center}
.lnk.red{color:#e5484d}
.code{background:#000;border:1px solid var(--line2);border-radius:12px;padding:12px;font:12px/1.45 ui-monospace,Menlo,monospace;color:var(--mid);word-break:break-all;margin:8px 0}
.steps{color:var(--mid);font-size:14.5px;line-height:1.55;padding-left:18px;margin:8px 0}
.steps b{color:var(--hi);font-weight:600}
/* login */
.login{max-width:360px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18vh) 24px 40px}
.login h1{margin-bottom:8px}
.login input{display:block;width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:14px;font-size:16px;margin-top:10px;outline:none}
.err{color:#e5484d;font-size:14px;min-height:20px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,10px);background:var(--hi);color:#000;font-size:14px;font-weight:500;padding:9px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:30;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
</style>
</head>
<body>
<div id="login" class="login hide">
  <h1>Pendientes</h1>
  <div class="sub">Entra con la misma cuenta de tu panel.</div>
  <form id="loginForm">
    <input id="email" type="email" placeholder="Correo" autocomplete="username" required>
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button class="btn" id="loginBtn">Entrar</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" class="hide">
  <div class="wrap">
    <header>
      <div><h1>Pendientes</h1><div class="sub" id="cuenta"></div></div>
      <button class="dots" id="menuBtn" aria-label="Opciones">•••</button>
    </header>
    <nav class="tabs" id="tabs"></nav>
    <div id="lista"></div>
  </div>
  <div class="bar"><form class="bar-in" id="addForm">
    <button type="button" class="dest" id="dest"></button>
    <input id="nuevo" placeholder="Anotar algo…" autocomplete="off" enterkeyhint="send">
    <button class="send" id="send" aria-label="Agregar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form></div>
</div>

<div class="sh-bg" id="sheet"><div class="sh"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://lafahdrnkqdbtpfzwfht.supabase.co', SB_KEY='sb_publishable_Y75BgtwGsw-YKlPc40hddg_pVJvwwqZ';
const LISTAS=[{id:'personal',n:'Personal'},{id:'prq',n:'PRQ'},{id:'podcast',n:'Podcast'},{id:'proyectos',n:'Proyectos'}];
const nom=id=>(LISTAS.find(l=>l.id===id)||LISTAS[0]).n;
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

let sb=null,user=null,tareas=ls.get('pend_cache',[]),filtro=ls.get('pend_filtro','todo'),dest=ls.get('pend_dest','personal'),verHechas=false;
try{sb=window.supabase.createClient(SB_URL,SB_KEY);}catch(e){}

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
const orden=(a,b)=>(b.importante-a.importante)||String(b.creada).localeCompare(String(a.creada));

function pintar(){
  const abiertas=tareas.filter(t=>!t.hecha);
  $('tabs').innerHTML=[{id:'todo',n:'Todo'}].concat(LISTAS).map(l=>{
    const c=l.id==='todo'?abiertas.length:abiertas.filter(t=>t.lista===l.id).length;
    return `<button class="tab${filtro===l.id?' on':''}" data-f="${l.id}">${l.n}${c?`<sup>${c}</sup>`:''}</button>`;}).join('');
  $('cuenta').textContent=abiertas.length?abiertas.length+' por hacer':'Todo al día';
  const vis=tareas.filter(t=>filtro==='todo'||t.lista===filtro);
  const ab=vis.filter(t=>!t.hecha).sort(orden);
  const he=vis.filter(t=>t.hecha).sort((a,b)=>String(b.hecha_en).localeCompare(String(a.hecha_en)));
  const fila=t=>`<div class="row${t.hecha?' done':''}${t.importante?' imp':''}" data-id="${t.id}"><button class="ck" data-ck="${t.id}" aria-label="Hecho">${CHECK}</button><button class="tx" data-ed="${t.id}">${esc(t.texto)}${filtro==='todo'?`<small>${nom(t.lista)}</small>`:''}</button></div>`;
  let h=ab.map(fila).join('');
  if(!ab.length)h=`<div class="empty">${tareas.length?'Nada pendiente aquí.':'Escribe abajo lo primero que tengas pendiente.'}</div>`;
  if(he.length){
    h+=`<button class="hechas-t" id="verHechas">${verHechas?'Ocultar':'Ver'} hechas · ${he.length}</button>`;
    if(verHechas)h+=he.slice(0,40).map(fila).join('')+`<button class="limpiar" id="limpiar">Borrar las hechas</button>`;
  }
  $('lista').innerHTML=h;
  if(filtro!=='todo')dest=filtro;
  $('dest').textContent=nom(dest);
  ls.set('pend_cache',tareas);
}

async function cargar(){
  if(!user)return;
  const {data,error}=await sb.from('tareas').select('*').order('creada',{ascending:false}).limit(500);
  if(error){toast('Sin conexión');return;}
  tareas=data;pintar();
}

/* agregar */
$('nuevo').addEventListener('input',()=>$('send').classList.toggle('on',!!$('nuevo').value.trim()));
$('dest').addEventListener('click',()=>{
  const i=LISTAS.findIndex(l=>l.id===dest);dest=LISTAS[(i+1)%LISTAS.length].id;ls.set('pend_dest',dest);
  if(filtro!=='todo'){filtro=dest;ls.set('pend_filtro',filtro);}
  pintar();$('nuevo').focus();
});
$('addForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const texto=$('nuevo').value.trim();if(!texto)return;
  const tmp={id:'tmp'+Date.now(),lista:dest,texto,hecha:false,importante:false,creada:new Date().toISOString()};
  tareas.unshift(tmp);$('nuevo').value='';$('send').classList.remove('on');pintar();
  const {data,error}=await sb.from('tareas').insert({lista:dest,texto}).select().single();
  if(error){tareas=tareas.filter(t=>t!==tmp);pintar();$('nuevo').value=texto;toast('No se pudo guardar');return;}
  Object.assign(tmp,data);pintar();
});

/* marcar / editar */
async function actualizar(t,cambios){
  const antes={...t};Object.assign(t,cambios);pintar();
  const {error}=await sb.from('tareas').update(cambios).eq('id',t.id);
  if(error){Object.assign(t,antes);pintar();toast('No se pudo guardar');}
}
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');if(f){filtro=f.dataset.f;ls.set('pend_filtro',filtro);pintar();return;}
  const ck=e.target.closest('[data-ck]');
  if(ck){
    const t=tareas.find(x=>x.id===ck.dataset.ck);if(!t)return;
    const row=ck.closest('.row');
    if(!t.hecha){row.classList.add('done');if(navigator.vibrate)navigator.vibrate(10);setTimeout(()=>row.classList.add('go'),380);setTimeout(()=>actualizar(t,{hecha:true,hecha_en:new Date().toISOString()}),700);}
    else actualizar(t,{hecha:false,hecha_en:null});
    return;
  }
  const ed=e.target.closest('[data-ed]');if(ed){editar(ed.dataset.ed);return;}
  if(e.target.closest('#verHechas')){verHechas=!verHechas;pintar();return;}
  if(e.target.closest('#limpiar')){
    const ids=tareas.filter(t=>t.hecha&&(filtro==='todo'||t.lista===filtro)).map(t=>t.id);
    tareas=tareas.filter(t=>!ids.includes(t.id));pintar();
    sb.from('tareas').delete().in('id',ids).then(({error})=>{if(error){toast('No se pudo borrar');cargar();}});
  }
});

const sheet=$('sheet');
const abrir=h=>{$('sheetBody').innerHTML=h;sheet.classList.add('show');};
const cerrar=()=>{sheet.classList.remove('show');if(document.activeElement)document.activeElement.blur();};
sheet.addEventListener('click',e=>{if(e.target===sheet)cerrar();});

function editar(id){
  const t=tareas.find(x=>x.id===id);if(!t)return;
  let lista=t.lista,imp=!!t.importante;
  abrir(`<textarea id="eTx" rows="3">${esc(t.texto)}</textarea>
    <div class="lbl">Lista</div><div class="chips">${LISTAS.map(l=>`<button class="chip${l.id===lista?' on':''}" data-l="${l.id}">${l.n}</button>`).join('')}</div>
    <button class="sw" id="eImp"><span>Importante (va arriba)</span><span class="tog${imp?' on':''}"></span></button>
    <button class="btn" id="eOk">Listo</button>
    <button class="lnk red" id="eDel">Eliminar</button>`);
  $('sheetBody').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lista=b.dataset.l;$('sheetBody').querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('on',x===b));});
  $('eImp').onclick=()=>{imp=!imp;$('eImp').querySelector('.tog').classList.toggle('on',imp);};
  $('eOk').onclick=()=>{const tx=$('eTx').value.trim();cerrar();if(!tx)return;
    const c={};if(tx!==t.texto)c.texto=tx;if(lista!==t.lista)c.lista=lista;if(imp!==!!t.importante)c.importante=imp;
    if(Object.keys(c).length)actualizar(t,c);};
  $('eDel').onclick=async()=>{cerrar();tareas=tareas.filter(x=>x!==t);pintar();
    const {error}=await sb.from('tareas').delete().eq('id',t.id);if(error){toast('No se pudo eliminar');cargar();}};
}

/* menú: atajo para la pantalla de bloqueo */
$('menuBtn').addEventListener('click',async()=>{
  abrir(`<div style="font-size:20px;font-weight:700;margin-bottom:6px">Anotar desde la pantalla de bloqueo</div>
    <div class="steps" style="padding:0">Un atajo de 3 pasos que te pide el texto y lo guarda aquí sin abrir nada.</div>
    <div id="atajoBox" class="code">Cargando tu link…</div>
    <button class="btn" id="copiar">Copiar link</button>
    <button class="lnk red" id="salir">Cerrar sesión</button>`);
  $('salir').onclick=async()=>{cerrar();await sb.auth.signOut();user=null;tareas=[];ls.set('pend_cache',[]);mostrar();};
  const {data:tok,error}=await sb.rpc('obtener_token_atajo');
  if(error||!tok){$('atajoBox').textContent='Primero crea la clave del atajo en tu Panel Financiero (Ajustes).';$('copiar').classList.add('hide');return;}
  const link=SB_URL+'/functions/v1/tarea?t='+tok+'&x=';
  $('atajoBox').textContent=link;
  $('copiar').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('Link copiado');}catch(e){toast('Mantén presionado el link para copiarlo');}};
});

/* sesión */
function mostrar(){$('login').classList.toggle('hide',!!user);$('app').classList.toggle('hide',!user);if(user)pintar();}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('loginErr').textContent='';$('loginBtn').textContent='Entrando…';
  const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});
  $('loginBtn').textContent='Entrar';
  if(error){$('loginErr').textContent=/invalid/i.test(error.message)?'Correo o contraseña incorrectos':'No se pudo entrar';return;}
  user=data.user;mostrar();cargar();
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')cargar();});
(async()=>{
  if(!sb){$('login').classList.remove('hide');$('loginErr').textContent='Sin conexión';return;}
  const {data}=await sb.auth.getSession();
  user=data.session?data.session.user:null;mostrar();if(user)cargar();
})();
</script>
</body>
</html>
