<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pendientes</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pendientes">
<link rel="apple-touch-icon" href="icon-pend-180.png">
<link rel="icon" href="icon-pend-192.png">
<link rel="manifest" href="manifest-pendientes.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --hi:#fff;--mid:rgba(255,255,255,.62);--dim:rgba(255,255,255,.38);
  --glass:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
  --glass-b:rgba(255,255,255,.13);
  --glass-hl:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(255,255,255,.03);
  --blur:blur(28px) saturate(170%);
  --safe-b:env(safe-area-inset-bottom);
  --spring:cubic-bezier(.2,.9,.25,1.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#000}
html,body{margin:0;min-height:100%;color:var(--hi);font:400 16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--hi)}
/* fondo: luces suaves que se mueven detrás del cristal */
.amb{position:fixed;inset:-20%;z-index:-1;pointer-events:none;overflow:hidden}
.amb i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9;animation:flota 22s ease-in-out infinite alternate}
.amb i:nth-child(1){width:60vmax;height:60vmax;left:-8%;top:2%;background:radial-gradient(circle,#5a6a86 0%,transparent 62%)}
.amb i:nth-child(2){width:55vmax;height:55vmax;right:-12%;top:28%;background:radial-gradient(circle,#55497a 0%,transparent 62%);animation-duration:28s;animation-delay:-8s}
.amb i:nth-child(3){width:50vmax;height:50vmax;left:18%;bottom:-6%;background:radial-gradient(circle,#2f5a5e 0%,transparent 62%);animation-duration:32s;animation-delay:-15s}
@keyframes flota{to{transform:translate3d(6%,-5%,0) scale(1.12)}}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 80% at 50% 0%,transparent 40%,rgba(0,0,0,.55) 100%)}
.glass{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-hl),0 12px 34px -14px rgba(0,0,0,.7);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 26px) 16px calc(120px + var(--safe-b))}
header{display:flex;align-items:center;justify-content:space-between;margin:0 4px 18px}
h1{font-size:36px;font-weight:700;letter-spacing:-.035em;margin:0;line-height:1.05}
.sub{color:var(--mid);font-size:15px;margin-top:4px}
.dots{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dots svg{width:20px;height:20px;opacity:.85}

.seg{display:flex;gap:2px;padding:4px;border-radius:999px;overflow-x:auto;scrollbar-width:none;margin-bottom:18px;position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:4}
.seg::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:9px 8px;border-radius:999px;color:var(--mid);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .3s,color .3s,box-shadow .3s}
.tab.on{color:#fff;background:rgba(255,255,255,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 4px 14px -6px rgba(0,0,0,.6)}
.tab sup{font-size:10px;margin-left:3px;opacity:.55;font-weight:600;vertical-align:1px}

.row{display:flex;align-items:center;gap:14px;padding:15px 16px;margin-bottom:10px;border-radius:24px;transition:opacity .4s,transform .45s var(--spring)}
.row.in{animation:entra .55s var(--spring)}
@keyframes entra{from{opacity:0;transform:translateY(-10px) scale(.96)}}
.row.go{opacity:0;transform:scale(.94) translateY(6px)}
.ck{flex:0 0 26px;width:26px;height:26px;border-radius:50%;border:1.6px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;transition:background .25s,border-color .25s,transform .35s var(--spring);box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.ck svg{width:13px;height:13px;opacity:0;transform:scale(.4);transition:.3s var(--spring)}
.ck:active{transform:scale(.85)}
.row.done .ck{background:#fff;border-color:#fff;box-shadow:0 0 18px rgba(255,255,255,.35)}
.row.done .ck svg{opacity:1;transform:none}
.tx{flex:1;min-width:0;text-align:left;font-size:17px;line-height:1.3;overflow-wrap:anywhere;padding:2px 0}
.tag{display:inline-block;margin-top:6px;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);color:var(--mid);font-size:11.5px;font-weight:600;letter-spacing:.01em}
.row.imp{background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.06));border-color:rgba(255,255,255,.22)}
.row.imp .tx{font-weight:600}
.star{margin-left:auto;flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8)}
.row.done{background:rgba(255,255,255,.03);box-shadow:none;border-color:rgba(255,255,255,.06)}
.row.done .tx{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3);font-weight:400}
.row.done .star{display:none}
.empty{text-align:center;padding:70px 24px;color:var(--mid);font-size:16px;line-height:1.55;border-radius:28px}
.empty b{display:block;font-size:22px;color:#fff;margin-bottom:6px;font-weight:600}
.hechas-t{display:block;margin:24px auto 12px;padding:8px 16px;border-radius:999px;color:var(--mid);font-size:13.5px;font-weight:600}
.limpiar{display:block;margin:12px auto 0;color:var(--dim);font-size:13.5px;padding:8px}

/* barra flotante para anotar */
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(12px + var(--safe-b));z-index:6;pointer-events:none}
.bar-in{pointer-events:auto;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;border-radius:30px;padding:7px 7px 7px 8px;background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 20px 50px -12px rgba(0,0,0,.85);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%)}
.dest{flex:0 0 auto;padding:8px 13px;border-radius:22px;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);color:#fff;font-size:13.5px;font-weight:600;white-space:nowrap;transition:transform .3s var(--spring)}
.dest:active{transform:scale(.92)}
.bar input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:17px;padding:8px 2px}
.bar input::placeholder{color:var(--dim)}
.send{flex:0 0 40px;width:40px;height:40px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;opacity:.22;transform:scale(.85);transition:opacity .25s,transform .35s var(--spring);box-shadow:0 4px 16px rgba(255,255,255,.25)}
.send.on{opacity:1;transform:none}

/* hoja flotante */
.sh-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;padding:0 8px calc(8px + var(--safe-b))}
.sh-bg.show{opacity:1;pointer-events:auto}
.sh{width:100%;max-width:540px;border-radius:34px;padding:10px 20px 20px;background:linear-gradient(160deg,rgba(60,60,66,.62),rgba(30,30,34,.55));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 30px 80px -20px rgba(0,0,0,.9);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);transform:translateY(40px) scale(.97);transition:transform .45s var(--spring)}
.sh-bg.show .sh{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 16px}
.sh textarea{width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px 15px;font-size:17px;resize:none;outline:none}
.lbl{color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:18px 4px 9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 15px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:var(--mid);font-size:14.5px;font-weight:600;transition:.25s}
.chip.on{background:#fff;color:#000;border-color:#fff}
.sw{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:16px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.06);font-size:16px}
.tog{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.18);position:relative;transition:.3s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:.35s var(--spring)}
.tog.on{background:#34c759}.tog.on::after{left:22px}
.btn{display:block;width:100%;margin-top:18px;padding:16px;border-radius:20px;background:#fff;color:#000;font-weight:600;font-size:16.5px;text-align:center;box-shadow:0 6px 24px -6px rgba(255,255,255,.3)}
.lnk{display:block;width:100%;padding:14px 0 2px;color:var(--mid);font-size:15.5px;text-align:center}
.lnk.red{color:#ff6961}
.code{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;font:12px/1.45 ui-monospace,Menlo,monospace;color:var(--mid);word-break:break-all;margin:12px 0 0}
.steps{color:var(--mid);font-size:15px;line-height:1.5;margin:6px 0}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:360px;border-radius:32px;padding:30px 22px 22px}
.login h1{font-size:30px}
.login input{display:block;width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:15px;font-size:16px;margin-top:10px;outline:none}
.err{color:#ff6961;font-size:14px;min-height:20px;margin-top:10px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,12px) scale(.96);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.35s var(--spring);pointer-events:none;z-index:30;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){.amb i{animation:none}}
</style>
</head>
<body>
<div class="amb"><i></i><i></i><i></i></div><div class="grain"></div>
<div id="login" class="login hide"><div class="login-card glass">
  <h1>Pendientes</h1>
  <div class="sub">Entra con la misma cuenta de tu panel.</div>
  <form id="loginForm">
    <input id="email" type="email" placeholder="Correo" autocomplete="username" required>
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button class="btn" id="loginBtn">Entrar</button>
    <div class="err" id="loginErr"></div>
  </form>
</div></div>

<div id="app" class="hide">
  <div class="wrap">
    <header>
      <div><h1>Pendientes</h1><div class="sub" id="cuenta"></div></div>
      <button class="dots glass" id="menuBtn" aria-label="Opciones"><svg viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    </header>
    <nav class="seg glass" id="tabs"></nav>
    <div id="lista"></div>
  </div>
  <div class="bar"><form class="bar-in" id="addForm">
    <button type="button" class="dest" id="dest"></button>
    <input id="nuevo" placeholder="Anotar algo…" autocomplete="off" enterkeyhint="send">
    <button class="send" id="send" aria-label="Agregar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form></div>
</div>

<div class="sh-bg" id="sheet"><div class="sh"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div class="toast glass" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://lafahdrnkqdbtpfzwfht.supabase.co', SB_KEY='sb_publishable_Y75BgtwGsw-YKlPc40hddg_pVJvwwqZ';
const LISTAS=[{id:'personal',n:'Personal'},{id:'prq',n:'PRQ'},{id:'podcast',n:'Podcast'},{id:'proyectos',n:'Proyectos'}];
const nom=id=>(LISTAS.find(l=>l.id===id)||LISTAS[0]).n;
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

let recien=null,sb=null,user=null,tareas=ls.get('pend_cache',[]),filtro=ls.get('pend_filtro','todo'),dest=ls.get('pend_dest','personal'),verHechas=false;
try{sb=window.supabase.createClient(SB_URL,SB_KEY);}catch(e){}

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
const orden=(a,b)=>(b.importante-a.importante)||String(b.creada).localeCompare(String(a.creada));

function pintar(){
  const abiertas=tareas.filter(t=>!t.hecha);
  $('tabs').innerHTML=[{id:'todo',n:'Todo'}].concat(LISTAS).map(l=>{
    const c=l.id==='todo'?abiertas.length:abiertas.filter(t=>t.lista===l.id).length;
    return `<button class="tab${filtro===l.id?' on':''}" data-f="${l.id}">${l.n}${c?`<sup>${c}</sup>`:''}</button>`;}).join('');
  $('cuenta').textContent=abiertas.length?abiertas.length+' por hacer':'Todo al día';
  const vis=tareas.filter(t=>filtro==='todo'||t.lista===filtro);
  const ab=vis.filter(t=>!t.hecha).sort(orden);
  const he=vis.filter(t=>t.hecha).sort((a,b)=>String(b.hecha_en).localeCompare(String(a.hecha_en)));
  const fila=t=>`<div class="row glass${t.hecha?' done':''}${t.importante?' imp':''}${t.id===recien?' in':''}" data-id="${t.id}"><button class="ck" data-ck="${t.id}" aria-label="Hecho">${CHECK}</button><button class="tx" data-ed="${t.id}">${esc(t.texto)}${filtro==='todo'?`<br><span class="tag">${nom(t.lista)}</span>`:''}</button>${t.importante?'<span class="star"></span>':''}</div>`;
  let h=ab.map(fila).join('');
  if(!ab.length)h=`<div class="empty glass">${tareas.length?'<b>Todo listo</b>Nada pendiente aquí.':'<b>Empecemos</b>Escribe abajo lo primero que tengas pendiente.'}</div>`;
  if(he.length){
    h+=`<button class="hechas-t glass" id="verHechas">${verHechas?'Ocultar':'Ver'} hechas · ${he.length}</button>`;
    if(verHechas)h+=he.slice(0,40).map(fila).join('')+`<button class="limpiar" id="limpiar">Borrar las hechas</button>`;
  }
  $('lista').innerHTML=h;recien=null;
  if(filtro!=='todo')dest=filtro;
  $('dest').textContent=nom(dest);
  ls.set('pend_cache',tareas);
}

async function cargar(){
  if(!user)return;
  const {data,error}=await sb.from('tareas').select('*').order('creada',{ascending:false}).limit(500);
  if(error){toast('Sin conexión');return;}
  tareas=data;pintar();
}

/* agregar */
$('nuevo').addEventListener('input',()=>$('send').classList.toggle('on',!!$('nuevo').value.trim()));
$('dest').addEventListener('click',()=>{
  const i=LISTAS.findIndex(l=>l.id===dest);dest=LISTAS[(i+1)%LISTAS.length].id;ls.set('pend_dest',dest);
  if(filtro!=='todo'){filtro=dest;ls.set('pend_filtro',filtro);}
  pintar();$('nuevo').focus();
});
$('addForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const texto=$('nuevo').value.trim();if(!texto)return;
  const tmp={id:'tmp'+Date.now(),lista:dest,texto,hecha:false,importante:false,creada:new Date().toISOString()};
  tareas.unshift(tmp);recien=tmp.id;$('nuevo').value='';$('send').classList.remove('on');pintar();
  const {data,error}=await sb.from('tareas').insert({lista:dest,texto}).select().single();
  if(error){tareas=tareas.filter(t=>t!==tmp);pintar();$('nuevo').value=texto;toast('No se pudo guardar');return;}
  Object.assign(tmp,data);pintar();
});

/* marcar / editar */
async function actualizar(t,cambios){
  const antes={...t};Object.assign(t,cambios);pintar();
  const {error}=await sb.from('tareas').update(cambios).eq('id',t.id);
  if(error){Object.assign(t,antes);pintar();toast('No se pudo guardar');}
}
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');if(f){filtro=f.dataset.f;ls.set('pend_filtro',filtro);pintar();return;}
  const ck=e.target.closest('[data-ck]');
  if(ck){
    const t=tareas.find(x=>x.id===ck.dataset.ck);if(!t)return;
    const row=ck.closest('.row');
    if(!t.hecha){row.classList.add('done');if(navigator.vibrate)navigator.vibrate(10);setTimeout(()=>row.classList.add('go'),380);setTimeout(()=>actualizar(t,{hecha:true,hecha_en:new Date().toISOString()}),700);}
    else actualizar(t,{hecha:false,hecha_en:null});
    return;
  }
  const ed=e.target.closest('[data-ed]');if(ed){editar(ed.dataset.ed);return;}
  if(e.target.closest('#verHechas')){verHechas=!verHechas;pintar();return;}
  if(e.target.closest('#limpiar')){
    const ids=tareas.filter(t=>t.hecha&&(filtro==='todo'||t.lista===filtro)).map(t=>t.id);
    tareas=tareas.filter(t=>!ids.includes(t.id));pintar();
    sb.from('tareas').delete().in('id',ids).then(({error})=>{if(error){toast('No se pudo borrar');cargar();}});
  }
});

const sheet=$('sheet');
const abrir=h=>{$('sheetBody').innerHTML=h;sheet.classList.add('show');};
const cerrar=()=>{sheet.classList.remove('show');if(document.activeElement)document.activeElement.blur();};
sheet.addEventListener('click',e=>{if(e.target===sheet)cerrar();});

function editar(id){
  const t=tareas.find(x=>x.id===id);if(!t)return;
  let lista=t.lista,imp=!!t.importante;
  abrir(`<textarea id="eTx" rows="3">${esc(t.texto)}</textarea>
    <div class="lbl">Lista</div><div class="chips">${LISTAS.map(l=>`<button class="chip${l.id===lista?' on':''}" data-l="${l.id}">${l.n}</button>`).join('')}</div>
    <button class="sw" id="eImp"><span>Importante (va arriba)</span><span class="tog${imp?' on':''}"></span></button>
    <button class="btn" id="eOk">Listo</button>
    <button class="lnk red" id="eDel">Eliminar</button>`);
  $('sheetBody').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lista=b.dataset.l;$('sheetBody').querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('on',x===b));});
  $('eImp').onclick=()=>{imp=!imp;$('eImp').querySelector('.tog').classList.toggle('on',imp);};
  $('eOk').onclick=()=>{const tx=$('eTx').value.trim();cerrar();if(!tx)return;
    const c={};if(tx!==t.texto)c.texto=tx;if(lista!==t.lista)c.lista=lista;if(imp!==!!t.importante)c.importante=imp;
    if(Object.keys(c).length)actualizar(t,c);};
  $('eDel').onclick=async()=>{cerrar();tareas=tareas.filter(x=>x!==t);pintar();
    const {error}=await sb.from('tareas').delete().eq('id',t.id);if(error){toast('No se pudo eliminar');cargar();}};
}

/* menú: atajo para la pantalla de bloqueo */
$('menuBtn').addEventListener('click',async()=>{
  abrir(`<div style="font-size:21px;font-weight:700;margin:2px 4px 6px">Anotar desde la pantalla de bloqueo</div>
    <div class="steps" style="padding:0">Un atajo de 3 pasos que te pide el texto y lo guarda aquí sin abrir nada.</div>
    <div id="atajoBox" class="code">Cargando tu link…</div>
    <button class="btn" id="copiar">Copiar link</button>
    <button class="lnk red" id="salir">Cerrar sesión</button>`);
  $('salir').onclick=async()=>{cerrar();await sb.auth.signOut();user=null;tareas=[];ls.set('pend_cache',[]);mostrar();};
  const {data:tok,error}=await sb.rpc('obtener_token_atajo');
  if(error||!tok){$('atajoBox').textContent='Primero crea la clave del atajo en tu Panel Financiero (Ajustes).';$('copiar').classList.add('hide');return;}
  const link=SB_URL+'/functions/v1/tarea?t='+tok+'&x=';
  $('atajoBox').textContent=link;
  $('copiar').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('Link copiado');}catch(e){toast('Mantén presionado el link para copiarlo');}};
});

/* sesión */
function mostrar(){$('login').classList.toggle('hide',!!user);$('app').classList.toggle('hide',!user);if(user)pintar();}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('loginErr').textContent='';$('loginBtn').textContent='Entrando…';
  const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});
  $('loginBtn').textContent='Entrar';
  if(error){$('loginErr').textContent=/invalid/i.test(error.message)?'Correo o contraseña incorrectos':'No se pudo entrar';return;}
  user=data.user;mostrar();cargar();
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')cargar();});
(async()=>{
  if(!sb){$('login').classList.remove('hide');$('loginErr').textContent='Sin conexión';return;}
  const {data}=await sb.auth.getSession();
  user=data.session?data.session.user:null;mostrar();if(user)cargar();
})();
</script>
