<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pendientes</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pendientes">
<link rel="apple-touch-icon" href="icon-pend-180.png">
<link rel="icon" href="icon-pend-192.png">
<link rel="manifest" href="manifest-pendientes.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --hi:#fff;--mid:rgba(255,255,255,.62);--dim:rgba(255,255,255,.38);
  --glass:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
  --glass-b:rgba(255,255,255,.13);
  --glass-hl:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(255,255,255,.03);
  --blur:blur(28px) saturate(170%);
  --safe-b:env(safe-area-inset-bottom);
  --spring:cubic-bezier(.2,.9,.25,1.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#000}
html,body{margin:0;min-height:100%;color:var(--hi);font:400 16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--hi)}
/* fondo: luces suaves que se mueven detrás del cristal */
.amb{position:fixed;inset:-20%;z-index:-1;pointer-events:none;overflow:hidden}
.amb i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9;animation:flota 22s ease-in-out infinite alternate}
.amb i:nth-child(1){width:60vmax;height:60vmax;left:-8%;top:2%;background:radial-gradient(circle,#5a6a86 0%,transparent 62%)}
.amb i:nth-child(2){width:55vmax;height:55vmax;right:-12%;top:28%;background:radial-gradient(circle,#55497a 0%,transparent 62%);animation-duration:28s;animation-delay:-8s}
.amb i:nth-child(3){width:50vmax;height:50vmax;left:18%;bottom:-6%;background:radial-gradient(circle,#2f5a5e 0%,transparent 62%);animation-duration:32s;animation-delay:-15s}
@keyframes flota{to{transform:translate3d(6%,-5%,0) scale(1.12)}}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 80% at 50% 0%,transparent 40%,rgba(0,0,0,.55) 100%)}
.glass{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-hl),0 12px 34px -14px rgba(0,0,0,.7);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 26px) 16px calc(120px + var(--safe-b))}
header{display:flex;align-items:center;justify-content:space-between;margin:0 4px 18px}
h1{font-size:36px;font-weight:700;letter-spacing:-.035em;margin:0;line-height:1.05}
.sub{color:var(--mid);font-size:15px;margin-top:4px}
.dots{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dots svg{width:20px;height:20px;opacity:.85}

.seg{display:flex;gap:2px;padding:4px;border-radius:999px;overflow-x:auto;scrollbar-width:none;margin-bottom:18px;position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:4}
.seg::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:9px 8px;border-radius:999px;color:var(--mid);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .3s,color .3s,box-shadow .3s}
.tab.on{color:#fff;background:rgba(255,255,255,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 4px 14px -6px rgba(0,0,0,.6)}
.tab sup{font-size:10px;margin-left:3px;opacity:.55;font-weight:600;vertical-align:1px}

.row{display:flex;align-items:center;gap:14px;padding:15px 16px;margin-bottom:10px;border-radius:24px;transition:opacity .4s,transform .45s var(--spring)}
.row.in{animation:entra .55s var(--spring)}
@keyframes entra{from{opacity:0;transform:translateY(-10px) scale(.96)}}
.row.go{opacity:0;transform:scale(.94) translateY(6px)}
.ck{flex:0 0 26px;width:26px;height:26px;border-radius:50%;border:1.6px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;transition:background .25s,border-color .25s,transform .35s var(--spring);box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.ck svg{width:13px;height:13px;opacity:0;transform:scale(.4);transition:.3s var(--spring)}
.ck:active{transform:scale(.85)}
.row.done .ck{background:#fff;border-color:#fff;box-shadow:0 0 18px rgba(255,255,255,.35)}
.row.done .ck svg{opacity:1;transform:none}
.tx{flex:1;min-width:0;text-align:left;font-size:17px;line-height:1.3;overflow-wrap:anywhere;padding:2px 0}
.tag{display:inline-block;margin-top:6px;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);color:var(--mid);font-size:11.5px;font-weight:600;letter-spacing:.01em}
.row.imp{background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.06));border-color:rgba(255,255,255,.22)}
.row.imp .tx{font-weight:600}
.star{margin-left:auto;flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8)}
.row.done{background:rgba(255,255,255,.03);box-shadow:none;border-color:rgba(255,255,255,.06)}
.row.done .tx{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3);font-weight:400}
.row.done .star{display:none}
.empty{text-align:center;padding:70px 24px;color:var(--mid);font-size:16px;line-height:1.55;border-radius:28px}
.empty b{display:block;font-size:22px;color:#fff;margin-bottom:6px;font-weight:600}
.hechas-t{display:block;margin:24px auto 12px;padding:8px 16px;border-radius:999px;color:var(--mid);font-size:13.5px;font-weight:600}
.limpiar{display:block;margin:12px auto 0;color:var(--dim);font-size:13.5px;padding:8px}

/* barra flotante para anotar */
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(12px + var(--safe-b));z-index:6;pointer-events:none}
.bar-in{pointer-events:auto;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;border-radius:30px;padding:7px 7px 7px 8px;background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 20px 50px -12px rgba(0,0,0,.85);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%)}
.dest{flex:0 0 auto;padding:8px 13px;border-radius:22px;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);color:#fff;font-size:13.5px;font-weight:600;white-space:nowrap;transition:transform .3s var(--spring)}
.dest:active{transform:scale(.92)}
.bar input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:17px;padding:8px 2px}
.bar input::placeholder{color:var(--dim)}
.send{flex:0 0 40px;width:40px;height:40px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;opacity:.22;transform:scale(.85);transition:opacity .25s,transform .35s var(--spring);box-shadow:0 4px 16px rgba(255,255,255,.25)}
.send.on{opacity:1;transform:none}

/* hoja flotante */
.sh-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;padding:0 8px calc(8px + var(--safe-b))}
.sh-bg.show{opacity:1;pointer-events:auto}
.sh{position:relative;display:flex;flex-direction:column;width:100%;max-width:540px;max-height:86vh;max-height:86dvh;overflow:hidden;border-radius:34px;background:linear-gradient(160deg,rgba(58,58,66,.96),rgba(30,30,36,.96));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 30px 80px -20px rgba(0,0,0,.9);transform:translateY(40px) scale(.97);transition:transform .45s var(--spring)}
.sh-bg.show .sh{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto}
.sh-head{flex:0 0 auto;position:relative;padding:12px 20px 14px;touch-action:none;cursor:grab}
.sh-ok{position:absolute;right:12px;top:8px;padding:7px 15px;border-radius:999px;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);font-weight:600;font-size:14px}
.sh-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 20px calc(20px + env(safe-area-inset-bottom))}
.sh.arrastre{transition:none}
.sh textarea{width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px 15px;font-size:17px;resize:none;outline:none}
.lbl{color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:18px 4px 9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 15px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:var(--mid);font-size:14.5px;font-weight:600;transition:.25s}
.chip.on{background:#fff;color:#000;border-color:#fff}
.sw{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:16px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.06);font-size:16px}
.tog{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.18);position:relative;transition:.3s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:.35s var(--spring)}
.tog.on{background:#34c759}.tog.on::after{left:22px}
.btn{display:block;width:100%;margin-top:18px;padding:16px;border-radius:20px;background:#fff;color:#000;font-weight:600;font-size:16.5px;text-align:center;box-shadow:0 6px 24px -6px rgba(255,255,255,.3)}
.lnk{display:block;width:100%;padding:14px 0 2px;color:var(--mid);font-size:15.5px;text-align:center}
.lnk.red{color:#ff6961}
.code{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;font:12px/1.45 ui-monospace,Menlo,monospace;color:var(--mid);word-break:break-all;margin:12px 0 0}
.steps{color:var(--mid);font-size:15px;line-height:1.5;margin:6px 0}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:360px;border-radius:32px;padding:30px 22px 22px}
.login h1{font-size:30px}
.login input{display:block;width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:15px;font-size:16px;margin-top:10px;outline:none}
.err{color:#ff6961;font-size:14px;min-height:20px;margin-top:10px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,12px) scale(.96);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.35s var(--spring);pointer-events:none;z-index:30;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){.amb i{animation:none}}
/* --- fechas, pasos, reuniones, arrastrar --- */
.seg{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.seg.fin{-webkit-mask-image:none;mask-image:none}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.meta:empty{display:none}
.tag{margin-top:0}
.fch{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);color:var(--mid)}
.fch.hoy{color:#ffd479;background:rgba(255,212,121,.1);border-color:rgba(255,212,121,.22)}
.fch.late{color:#ff8f87;background:rgba(255,105,97,.12);border-color:rgba(255,105,97,.25)}
.fch svg{width:11px;height:11px}
.pbar{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:999px;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);color:var(--mid)}
.pbar i{display:block;width:26px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
.pbar i b{display:block;height:100%;background:#fff;border-radius:2px}
.pa{display:flex;align-items:center;gap:10px;margin-top:9px;padding:8px 10px 8px 8px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden}
.pa-ck{flex:0 0 20px;width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;transition:.25s var(--spring)}
.pa-ck svg{width:10px;height:10px;opacity:0;transition:.2s}
.pa-ck.ok{background:#fff;border-color:#fff;transform:scale(1.15)}.pa-ck.ok svg{opacity:1}
.pa-t{flex:1;min-width:0;font-size:14.5px;font-weight:500;line-height:1.25;overflow-wrap:anywhere}
.pa-t small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:1px}
.pa-bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.06)}
.pa-bar b{display:block;height:100%;background:rgba(255,255,255,.55)}
.grp-t{color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:18px 6px 9px}
.grp-t:first-child{margin-top:4px}
.row{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row.drag{transition:none!important;transform:translateY(var(--dy,0)) scale(1.035);z-index:10;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 24px 50px -10px rgba(0,0,0,.9);background:linear-gradient(160deg,#3a3a42,#26262c);-webkit-backdrop-filter:none;backdrop-filter:none}
.row.mov{transition:transform .22s cubic-bezier(.2,.8,.25,1)!important}
/* reuniones */
.reu{display:flex;align-items:center;gap:14px;padding:13px 14px 13px 16px;margin-bottom:10px;border-radius:24px}
.reu .hr{flex:0 0 auto;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;text-align:right;min-width:46px}
.reu .hr small{display:block;color:var(--dim);font-weight:500;font-size:12px}
.reu .rt{flex:1;min-width:0;font-size:16px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.reu .rt em{display:inline-block;font-style:normal;font-size:11px;font-weight:700;color:#000;background:#34c759;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.reu.paso{opacity:.42}
.unirse{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:#fff;color:#000;font-size:13.5px;font-weight:700;text-decoration:none;box-shadow:0 4px 16px -4px rgba(255,255,255,.35)}
.unirse.ver{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.cal-cta{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;margin-bottom:12px;color:var(--mid);font-size:14.5px;text-align:left;width:100%}
.cal-cta b{color:#fff;font-weight:600}
.cal-cta .x{margin-left:auto;padding:4px 6px;color:var(--dim);font-size:18px;line-height:1}
/* pastilla de fecha al anotar */
.fpill{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:8px 11px;border-radius:22px;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);color:#fff;font-size:13.5px;font-weight:600;white-space:nowrap;transition:transform .3s var(--spring),background .2s}
.fpill svg{width:16px;height:16px;opacity:.85}
.fpill.vacia{padding:8px 9px;color:var(--mid)}
.fpill.hoy{background:rgba(255,212,121,.2);color:#ffd479}
.fpill.auto,.dest.auto{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.fpill:active,.dest:active{transform:scale(.9)}
.fwrap{position:relative;flex:0 0 auto;display:flex}
.f-over{position:absolute;inset:0;width:100%;height:100%;opacity:0;display:none;-webkit-appearance:none;appearance:none;border:0;padding:0;margin:0;font-size:16px;z-index:2}
.fwrap.elegir .f-over,.fwrap2 .f-over{display:block}
.fwrap2{position:relative;display:inline-flex}
/* menú al mantener presionado */
.ctx-bg{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s}
.ctx-bg.show{opacity:1;pointer-events:auto}
.row.lift{position:relative;z-index:16;transform:scale(1.03);background:linear-gradient(160deg,#3a3a42,#26262c);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 24px 50px -10px rgba(0,0,0,.9)}
.ctx{position:fixed;z-index:17;width:230px;border-radius:20px;padding:6px;background:linear-gradient(160deg,rgba(70,70,78,.75),rgba(40,40,46,.7));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 24px 60px -12px rgba(0,0,0,.9);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);opacity:0;transform:scale(.85);transform-origin:top left;transition:opacity .2s,transform .35s var(--spring);pointer-events:none}
.ctx.show{opacity:1;transform:none;pointer-events:auto}
.ctx button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 12px;border-radius:14px;font-size:16px;text-align:left}
.ctx button:active{background:rgba(255,255,255,.12)}
.ctx button+button{border-top:1px solid rgba(255,255,255,.07)}
.ctx .red{color:#ff6961}
.ctx span{opacity:.8}
/* pasos en la hoja */
.pasos{border-radius:18px;background:rgba(255,255,255,.05);padding:2px 14px}
.paso-r{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.paso-r:last-child{border-bottom:none}
.pck{flex:0 0 21px;width:21px;height:21px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center}
.pck svg{width:11px;height:11px;opacity:0}
.paso-r.ok .pck{background:#fff;border-color:#fff}.paso-r.ok .pck svg{opacity:1}
.paso-r.ok .pt{color:var(--dim);text-decoration:line-through}
.pt{flex:1;font-size:15.5px;overflow-wrap:anywhere}
.pdel{color:var(--dim);font-size:18px;padding:0 4px}
.pin{width:100%;background:none;border:none;outline:none;font-size:15.5px;padding:12px 0;color:#fff}
.pin::placeholder{color:var(--dim)}
.f-in{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.toast.accion{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px}
.toast .undo{padding:6px 12px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:13px}
.sec-h{font-size:17px;font-weight:700;margin:22px 4px 4px}
.sec-h:first-of-type{margin-top:4px}
.ayuda{color:var(--mid);font-size:14px;line-height:1.5;margin:6px 4px 0}
.ayuda b{color:#fff;font-weight:600}
.sh input.campo{width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;font-size:15px;margin-top:10px;outline:none}
.btn.sec{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2);margin-top:10px;padding:13px}
</style>
</head>
<body>
<div class="amb"><i></i><i></i><i></i></div><div class="grain"></div>
<div id="login" class="login hide"><div class="login-card glass">
  <h1>Pendientes</h1>
  <div class="sub">Entra con la misma cuenta de tu panel.</div>
  <form id="loginForm">
    <input id="email" type="email" placeholder="Correo" autocomplete="username" required>
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button class="btn" id="loginBtn">Entrar</button>
    <div class="err" id="loginErr"></div>
  </form>
</div></div>

<div id="app" class="hide">
  <div class="wrap">
    <header>
      <div><h1>Pendientes</h1><div class="sub" id="cuenta"></div></div>

const isoL=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

const DIAS=['dom','lun','mar','mié','jue','vie','sáb'],MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* leer lista, fecha e importancia escritas — el mismo código del atajo */
const parsear=(()=>{
// Lee lista, fecha e importancia de un texto en español. La misma lógica corre en la app y en el atajo.
// "prq renders casa silvestre 3 noviembre, urgente" -> {lista:'prq', texto:'renders casa silvestre', fecha:'2026-11-03', importante:true}
const P_DIAS = ["domingo", "lunes", "martes", "miercoles", "jueves", "viernes", "sabado"];
const P_MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const P_MES_RE = "(" + P_MESES.join("|") + "|ene|feb|mar|abr|may|jun|jul|ago|sept|sep|oct|nov|dic)";
const P_NUM = { un: 1, una: 1, uno: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12, quince: 15, veinte: 20, treinta: 30 };
const P_NUM_RE = "(\\d{1,3}|" + Object.keys(P_NUM).join("|") + ")";
const pNum = (s) => (/^\d+$/.test(s) ? +s : P_NUM[s] || 0);
const pTildes = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
const pIso = (y, m, d) => { const t = new Date(Date.UTC(y, m - 1, d, 12)); return t.getUTCMonth() === m - 1 ? t.toISOString().slice(0, 10) : null; };
const pSumar = (hoyISO, n) => { const d = new Date(hoyISO + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const pSumarMeses = (hoyISO, n) => { const [y, m, d] = hoyISO.split("-").map(Number); const t = new Date(Date.UTC(y, m - 1 + n, 1, 12)); const ult = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0, 12)).getUTCDate(); return pIso(t.getUTCFullYear(), t.getUTCMonth() + 1, Math.min(d, ult)); };
const pDiaSemana = (hoyISO) => new Date(hoyISO + "T12:00:00Z").getUTCDay();
// fecha con día y mes: si ya pasó este año, es la del próximo
function pDiaMes(hoyISO, d, m, y) {
  const y0 = +hoyISO.slice(0, 4);
  if (y) { y = +y; if (y < 100) y += 2000; return pIso(y, m, d); }
  const f = pIso(y0, m, d); if (!f) return null;
  return f < hoyISO ? pIso(y0 + 1, m, d) : f;
}
const pMesIdx = (s) => P_MESES.findIndex((x) => x.startsWith(s.slice(0, 3))) + 1;

function parsear(entrada, hoyISO) {
  let texto = String(entrada || "").replace(/\s+/g, " ").trim();
  let lista = null, importante = false;
  const primera = pTildes(texto.split(" ")[0] || "").toLowerCase().replace(/[:#,.\-]/g, "");
  const LISTAS = { prq: "prq", parcharq: "prq", cliente: "prq", clientes: "prq", podcast: "podcast", pod: "podcast", proyecto: "proyectos", proyectos: "proyectos", proy: "proyectos", personal: "personal" };
  if (LISTAS[primera] && texto.includes(" ")) { lista = LISTAS[primera]; texto = texto.slice(texto.split(" ")[0].length).replace(/^[\s:,\-]+/, ""); }

  // quitar un trozo del texto (las posiciones coinciden con la copia sin tildes)
  const quitar = (m) => {
    texto = (texto.slice(0, m.index) + " " + texto.slice(m.index + m[0].length)).replace(/\s+/g, " ").replace(/\s+([,.])/g, "$1").trim();
    texto = texto.replace(/^[\s,\-]+|[\s,\-]+$/g, "").replace(/\s+(?:para|el|de|antes del?|y|,)$/i, "").trim();
  };

  // importante / urgente
  const reImp = /(?:[\s,]*\b(?:y|es|muy|super)?\s*)\b(?:importante|improtante|imporante|urgente|prioridad|prioritario)\b/;
  let mi;
  while ((mi = pTildes(texto).toLowerCase().match(reImp))) { importante = true; quitar(mi); }
  if (/!!/.test(texto)) { importante = true; texto = texto.replace(/!!+/g, "").trim(); }

  const pre = "(?:\\b(?:para|antes del?|hasta el?|el|este|esta|de|dentro de)\\s+)*";
  const reglas = [
    // 20/11, 20-11, 20/11/2026
    [pre + "\\b(\\d{1,2})[/\\-](\\d{1,2})(?:[/\\-](\\d{2,4}))?\\b", (m) => pDiaMes(hoyISO, +m[1], +m[2], m[3])],
    // 3 de noviembre, 3 noviembre, 3 nov 2027
    [pre + "\\b(\\d{1,2})\\s+(?:de\\s+)?" + P_MES_RE + "\\b(?:\\s+(?:de\\s+|del\\s+)?(\\d{4}))?", (m) => pDiaMes(hoyISO, +m[1], pMesIdx(m[2]), m[3])],
    // noviembre 3
    [pre + "\\b" + P_MES_RE + "\\s+(\\d{1,2})\\b(?!\\s*(?:mil|\\.\\d|,\\d))", (m) => pDiaMes(hoyISO, +m[2], pMesIdx(m[1]))],
    [pre + "\\bpasado\\s+manana\\b", () => pSumar(hoyISO, 2)],
    [pre + "(?<!\\bla\\s|\\bpor\\sla\\s|\\ben\\sla\\s|\\bde\\sla\\s)\\bmanana\\b", () => pSumar(hoyISO, 1)],
    [pre + "\\bhoy\\b", () => hoyISO],
    // en 3 días, dentro de dos semanas, en un mes
    ["\\b(?:en|dentro\\s+de)\\s+" + P_NUM_RE + "\\s+(dias?|semanas?|mes|meses)\\b", (m) => {
      const n = pNum(m[1]); if (!n) return null;
      return /^d/.test(m[2]) ? pSumar(hoyISO, n) : /^s/.test(m[2]) ? pSumar(hoyISO, n * 7) : pSumarMeses(hoyISO, n);
    }],
    [pre + "\\bfin\\s+de\\s+mes\\b", () => { const [y, m] = hoyISO.split("-").map(Number); return pIso(y, m, new Date(Date.UTC(y, m, 0)).getUTCDate()); }],
    [pre + "\\bfin\\s+de\\s+semana\\b", () => { const w = pDiaSemana(hoyISO); return pSumar(hoyISO, (6 - w + 7) % 7); }],
    [pre + "\\b(?:la\\s+)?(?:proxima|otra|siguiente)\\s+semana\\b|\\bla\\s+semana\\s+que\\s+viene\\b", () => { const w = pDiaSemana(hoyISO); return pSumar(hoyISO, ((8 - w) % 7) || 7); }],
    [pre + "\\b(?:el\\s+)?(?:proximo|otro|siguiente)\\s+mes\\b|\\bel\\s+mes\\s+que\\s+viene\\b", () => { const [y, m] = hoyISO.split("-").map(Number); return pIso(m === 12 ? y + 1 : y, m === 12 ? 1 : m + 1, 1); }],
    // el 15 (este mes o el siguiente)
    ["(?:\\b(?:para|antes del?|hasta el?)\\s+)*\\bel\\s+(?:dia\\s+)?(\\d{1,2})\\b(?!\\s*(?:de\\s+)?(?:am|pm|h|horas|:|mil|\\.\\d|,\\d))", (m) => {
      const n = +m[1]; if (n < 1 || n > 31) return null;
      let [y, mo, d] = hoyISO.split("-").map(Number); if (n < d) { mo++; if (mo > 12) { mo = 1; y++; } }
      return pIso(y, mo, n);
    }],
    // viernes, el próximo lunes, el martes que viene
    [pre + "\\b(?:(proximo|siguiente)\\s+)?(" + P_DIAS.join("|") + ")(?:\\s+(?:que\\s+viene|proximo))?\\b", (m) => {
      const obj = P_DIAS.indexOf(m[2]); const w = pDiaSemana(hoyISO);
      let n = (obj - w + 7) % 7; if (m[1] || /que viene|proximo$/.test(m[0])) n = n || 7;
      return pSumar(hoyISO, n);
    }],
  ];
  let fecha = null;
  const plano = pTildes(texto).toLowerCase();
  for (const [re, fn] of reglas) {
    const m = plano.match(new RegExp(re));
    if (!m) continue;
    const f = fn(m); if (!f) continue;
    fecha = f; quitar(m); break;
  }
  if (!texto) texto = String(entrada || "").trim();
  return { lista, texto, fecha, importante };
}

return parsear;
})();

let arr=null;
document.addEventListener('pointerdown',e=>{

  arr={row,y0:e.clientY,listo:false,movio:false,timer:setTimeout(()=>levantar(row),420)};

function levantar(row){
  if(!arr||arr.row!==row)return;
  arr.listo=true;
  const grp=row.parentElement;
  if(grp.classList.contains('grp')){const filas=[...grp.children];arr.filas=filas;arr.idx=filas.indexOf(row);arr.nuevo=arr.idx;arr.rects=filas.map(r=>r.getBoundingClientRect());arr.alto=arr.rects[arr.idx].height+10;}
  if(navigator.vibrate)navigator.vibrate(15);

document.addEventListener('pointermove',e=>{
  if(!arr)return;
  const dy=e.clientY-arr.y0;
  if(!arr.listo){if(Math.abs(dy)>8){clearTimeout(arr.timer);arr=null;}return;}
  if(!arr.filas)return;
  if(!arr.movio){if(Math.abs(dy)<12)return;arr.movio=true;cerrarMenu(true);arr.row.classList.add('drag');arr.filas.forEach(r=>{if(r!==arr.row)r.classList.add('mov');});}
  arr.row.style.setProperty('--dy',dy+'px');
  const centro=arr.rects[arr.idx].top+arr.rects[arr.idx].height/2+dy;
  let n=arr.idx;
  arr.rects.forEach((r,i)=>{const m=r.top+r.height/2;if(i<arr.idx&&centro<m)n=Math.min(n,i);if(i>arr.idx&&centro>m)n=Math.max(n,i);});
  arr.nuevo=n;
  arr.filas.forEach((r,i)=>{if(i===arr.idx)return;let s=0;if(arr.idx<n&&i>arr.idx&&i<=n)s=-arr.alto;if(arr.idx>n&&i<arr.idx&&i>=n)s=arr.alto;r.style.transform=s?`translateY(${s}px)`:'';});
});

function soltar(){
  if(!arr)return;clearTimeout(arr.timer);
  const a=arr;arr=null;if(!a.listo)return;
  sinClick=true;setTimeout(()=>sinClick=false,400);
  if(!a.movio)return; // se queda el menú abierto
  a.filas.forEach(r=>{r.style.transform='';r.classList.remove('mov');});a.row.classList.remove('drag');a.row.style.removeProperty('--dy');
  if(a.nuevo===a.idx)return;
  const ids=a.filas.map(r=>r.dataset.id),[mov]=ids.splice(a.idx,1);ids.splice(a.nuevo,0,mov);
  const o=id=>(tareas.find(t=>t.id===id)||{}).orden||0;
  const ant=ids[a.nuevo-1],sig=ids[a.nuevo+1];
  const nuevo=ant&&sig?(o(ant)+o(sig))/2:ant?o(ant)+1:o(sig)-1;
  const t=tareas.find(x=>x.id===mov);if(t)actualizar(t,{orden:nuevo});
}

  user=data.user;mostrar();cargar();
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){cargar();}});
(async()=>{
  if(!sb){$('login').classList.remove('hide');$('loginErr').textContent='Sin conexión';return;}
  const {data}=await sb.auth.getSession();
  user=data.session?data.session.user:null;mostrar();if(user)cargar();
})();
